services:
  sardis-swim-tracker:
    build: .
    container_name: sardis-swim-tracker
    restart: unless-stopped
    ports:
      - "8503:8501"
    volumes:
      - ./data:/app/data
      - ./times:/app/times
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
